<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8A6A4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NOWENZA">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>NOWENZA Proforma Fatura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar no-print">
    <div>
      <strong>NOWENZA Proforma</strong>
      <span id="toolbarHint">— verileri doldur, PDF al</span>
    </div>
    <div class="toolbar-actions">
      <button type="button" class="lang-btn active" data-lang="tr" onclick="setLanguage('tr')">TR</button>
      <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
      <button type="button" onclick="addProduct()" id="addProductBtn">+ Ürün Ekle</button>
      <button type="button" class="primary" onclick="window.print()" id="printBtn">PDF / Yazdır</button>
    </div>
  </div>

  <main class="page">
    <header class="header">
      <div class="brand"><img src="logo.png" alt="NOWENZA Logo" class="logo"></div>
      <div class="invoice-head">
        <h1 id="invoiceTitle">PROFORMA FATURA</h1>
        <div class="meta-grid">
          <label><span data-i18n="date">TARİH</span><input id="date" type="date"></label>
          <label><span data-i18n="delivery">TESLİM</span><input id="delivery" type="date"></label>
        </div>
      </div>
    </header>

    <section class="two-col">
      <div class="card">
        <div class="section-title" data-i18n="seller">SATICI BİLGİLERİ</div>
        <div class="info-grid">
          <label><span data-i18n="company">FİRMA</span><input id="sellerCompany" value="NOWENZA Mobilyaları Üretim İth. İhr. Tic. Ltd. Şti."></label>
          <label><span data-i18n="address">ADRES</span><input id="sellerAddress" value="Güzelburç Mah. 2302. Cad. No:55 Antakya/Hatay · Huzur Mah. 52. Sok. Ada İş Merkezi No:38 İnegöl/Bursa"></label>
          <label><span data-i18n="whatsapp">WHATSAPP</span><input id="sellerWhatsapp" value="536 745 05 68"></label>
          <label><span data-i18n="phone">TELEFON</span><input id="sellerPhone"></label>
          <label><span data-i18n="email">E-MAİL</span><input id="sellerEmail"></label>
          <label><span data-i18n="web">WEB</span><input id="sellerWeb"></label>
        </div>
      </div>

      <div class="card">
        <div class="section-title" data-i18n="buyer">ALICI BİLGİLERİ</div>
        <div class="info-grid">
          <label><span data-i18n="company">FİRMA</span><input id="buyerCompany" value="SÖĞÜT MOBİLYA"></label>
          <label><span data-i18n="address">ADRES</span><input id="buyerAddress" value="HADIMKÖY 75. YIL CAD. NO:10A 34555 ARNAVUTKÖY / İSTANBUL"></label>
          <label><span data-i18n="contact">İLGİLİ KİŞİ</span><input id="buyerContact" value="RAMAZAN SÖĞÜT"></label>
          <label><span data-i18n="phone">TELEFON</span><input id="buyerPhone"></label>
          <label><span data-i18n="email">E-MAİL</span><input id="buyerEmail"></label>
          <label><span data-i18n="taxOffice">VERGİ DAİRESİ</span><input id="taxOffice"></label>
          <label><span data-i18n="taxNo">VERGİ NO</span><input id="taxNo"></label>
        </div>
      </div>
    </section>

    <section class="card bank-card">
      <div class="section-title" data-i18n="bankInfo">BANKA BİLGİLERİ</div>
      <div class="bank-grid">
        <label><span data-i18n="bank">BANKA</span><input id="bank"></label>
        <label><span data-i18n="account">HESAP</span><input id="account"></label>
        <label><span data-i18n="iban">IBAN</span><input id="iban"></label>
        <label><span data-i18n="descriptionName">AÇIKLAMA / İSİM</span><input id="bankName"></label>
        <label><span data-i18n="shipping">NAKLİYE</span><input id="shipping"></label>
      </div>
    </section>

    <section class="products-wrap">
      <div class="table-head">
        <div>#</div><div data-i18n="image">GÖRSEL</div><div data-i18n="productName">ÜRÜN İSMİ</div>
        <div data-i18n="details">DETAYLAR</div><div data-i18n="qty">ADET</div><div data-i18n="unitPrice">BİRİM FİYAT</div><div data-i18n="total">TOPLAM</div>
      </div>
      <div id="products"></div>
    </section>

    <section class="bottom-grid">
      <div class="note card">
        <div class="note-title" data-i18n="note">NOT</div>
        <textarea id="note">Sipariş geçildiğinde %30 ön ödeme alınır.
Ürün hazırlığı bittiğinde tarafınıza haber verilir.
Kalan ödeme tahsil edildikten sonra sevkiyatı yapılır.
Fiyatlarımız en az 500 adet alım için geçerlidir.</textarea>
      </div>
      <div class="totals card">
        <div class="total-row"><span data-i18n="subtotal">TOPLAM</span><strong id="subtotal">0,00 TL</strong></div>
        <div class="total-row grand"><span data-i18n="grandTotal">GENEL TOPLAM</span><strong id="grandTotal">0,00 TL</strong></div>
        <div class="total-row"><span><span data-i18n="deposit">ÖN ÖDEME (%)</span> <input id="depositRate" class="small-input" type="number" value="30"></span><strong id="deposit">0,00 TL</strong></div>
        <div class="total-row"><span data-i18n="balance">KALAN BAKİYE</span><strong id="balance">0,00 TL</strong></div>
      </div>
    </section>

    <section class="signatures">
      <div class="signature-box"><strong data-i18n="stampSignature">KAŞE VE İMZA</strong><div class="line"></div></div>
      <div class="signature-box"><strong data-i18n="customerApproval">MÜŞTERİ ONAYI</strong><div class="line"></div></div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script>
</body>
</html>
